# Why This Path Matters
# GitHub Actions only looks for workflow files inside .github/workflows/.

# If you put test.yml anywhere else, GitHub won’t detect it.

# .github/workflows/test.yml
name: Run Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npx vitest --coverage

# Runs on every push or pull request to main.
# Installs dependencies.
# Runs Vitest with coverage.
